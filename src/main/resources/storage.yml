# ============================================================================
# ArenaRegenDX — Snapshot storage configuration
# ============================================================================
# Controls how arena snapshots are serialised, compressed and written to disk.

# Compression algorithm. One of: NONE | GZIP | ZLIB
#   NONE  — fastest, largest files (use only for debugging).
#   GZIP  — good ratio, slightly slower than ZLIB.
#   ZLIB  — best balance (default). Uses java.util.zip.Deflater.
compression: ZLIB

# Deflater compression level (0..9, or -1 for default).
#   0  = no compression (fastest write, largest file)
#   1  = best speed
#   6  = default balance
#   9  = best compression (slowest write, smallest file)
compression-level: 6

# Delta storage: when saving a new snapshot that differs only slightly from the
# previous one, store only the changed blocks. Reduces disk usage and write time
# for incremental saves. (Currently informational — full snapshots are written.)
delta-storage: true

# Maximum number of snapshots retained per arena. Older snapshots are pruned
# automatically after each save.
max-snapshots-per-arena: 10

# Write snapshots to disk on a background thread (never blocks the server thread).
async-disk-write: true

# Size of the per-write byte buffer (bytes). Larger = fewer syscalls for big files.
write-buffer-size: 65536
