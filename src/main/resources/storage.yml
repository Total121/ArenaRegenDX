# ============================================================================
# ArenaRegenDX — Snapshot storage
# ============================================================================
# Snapshots live in plugins/ArenaRegenDX/snapshots/<arena>/<id>.ardx and are
# written to a temporary file first, then moved into place atomically.

# Compression algorithm: NONE | GZIP | ZLIB
#   NONE — fastest, largest files (debugging only)
#   GZIP — good ratio
#   ZLIB — best balance (default)
compression: ZLIB

# Deflater level for GZIP and ZLIB (0..9, or -1 for the library default).
#   1 = fastest   6 = balanced   9 = smallest files
compression-level: 6

# Snapshots kept per arena. Older ones are pruned after each save; the
# snapshot an arena currently restores from is never pruned.
max-snapshots-per-arena: 10

# Memory budget (MB) for decoded snapshots kept in RAM so repeated restores do
# not re-read the disk. Least recently used snapshots are evicted first.
# Typical arenas use 1 byte per block (4 for arenas with >65k block types).
cache-memory-mb: 256
