# ============================================================================
# ArenaRegenDX — Performance
# ============================================================================
# Defaults are tuned so a healthy 20 TPS server never feels a restore.
# Apply changes with /ardx reload.

# Max block writes per tick at full TPS. Work also stops when the time budget
# below is spent, whichever comes first.
max-block-budget: 20000

# Hard cap on restore time inside one tick, in milliseconds (0.4 - 12).
# This is the setting that keeps TPS stable on huge arenas. 6 ms is ~12% of a tick.
max-tick-millis: 6.0

# Global restore speed multiplier in percent (10 - 500). Scales both budgets.
# Presets: 40 = slow, 100 = normal, 200 = fast, 350 = max.
# Per-arena overrides: /ardx speed <arena> <value> (-1 / inherit = use this).
# A single tick never spends more than 25 ms restoring, whatever the speed.
regen-speed-percent: 100

# Budget scaling by server TPS: 100% above tps-full, 50% at tps-throttle,
# 10% at tps-crawl and below.
tps-full: 19.5
tps-throttle: 18.0
tps-crawl: 14.0

# Skip voxels that already match the snapshot (and air-to-air). Leave on.
# Containers and other block entities are still refilled because they carry data.
delta-skip: true

# If true, a block entity (chest, sign, ...) whose block already matches the
# snapshot keeps its current contents. Default false: looted chests are refilled.
skip-unchanged-tiles: false

# Record broken / placed / exploded voxels so automatic restores (explosion
# auto-regen, auto-reset timers) rewrite only what changed. Tracking starts
# trusted after a snapshot or full restore; until then restores are full.
dirty-tracking: true

# If more than this fraction of an arena is dirty, do a full restore instead.
dirty-full-threshold: 0.35

# Use the server's internal block setter (no neighbour physics, identity
# compare for delta skip). Falls back to the Bukkit API automatically.
nms-writes: true

# Capture / restore block entities (chests, signs, banners, ...) as full NBT.
nbt-tiles: true

# Folia only: chunks restored per tick, each on its own region thread.
# Paper restores on the main thread within the time budget above.
parallel-chunks: 4

# Boss bar for players inside an arena while it is being restored.
progress-bar: true

# Chunks scheduled per tick while capturing a snapshot. Block data is copied
# on the region thread and parsed off-thread, so this mostly bounds chunk loads.
chunk-batch-size: 8

# Threads used to compress snapshots (1 - 8).
queue-worker-threads: 2

# Minimum seconds between two automatic restores of the same arena
# (explosion / fire / piston auto-regen).
auto-regen-cooldown-seconds: 3
