# ============================================================================
# ArenaRegenDX — General configuration
# Author: DravoraX
# ============================================================================
# Apply changes with /ardx reload.

# Print the console banner on startup.
banner: true

# Allow the selection wand (players still need arenaregendx.wand).
wand-enabled: true

# When creating an arena or a cuboid exclusion, use the player's WorldEdit
# selection before the wand selection (requires WorldEdit). When false, the
# WorldEdit selection is only used if the wand box is incomplete.
prefer-worldedit-selection: false

# Automatic restores when something damages an arena that has a snapshot.
# Damage inside exclusion zones never triggers a restore. With dirty tracking
# (performance.yml) only the changed blocks are rewritten.
# Also toggleable in /ardx gui -> settings.
auto-regen:
  on-explosion: true
  on-fire: false        # can cause frequent restores in lava arenas
  on-piston: false

# Safe mode: after blocks are placed, players and mobs that ended up inside a
# solid block are moved up to the nearest free space. Players with
# arenaregendx.bypass are not protected when they start a restore themselves.
safe-mode-default: true
